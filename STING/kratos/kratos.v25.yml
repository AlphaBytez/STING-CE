version: v1.3.1
dsn: postgresql://postgres:postgres@db:5432/sting_app?sslmode=disable
log:
  level: debug
serve:
  public:
    base_url: https://localhost:8443
    host: 0.0.0.0
    port: 4433
    tls:
      cert:
        path: /etc/certs/server.crt
      key:
        path: /etc/certs/server.key
    cors:
      enabled: true
      allowed_origins:
      - http://localhost:8443
      - https://localhost:8443
      allowed_methods:
      - GET
      - POST
      - OPTIONS
      allowed_headers:
      - '*'
      allow_credentials: true
  admin:
    base_url: https://0.0.0.0:4434
    host: 0.0.0.0
    port: 4434
    tls:
      cert:
        path: /etc/certs/server.crt
      key:
        path: /etc/certs/server.key
identity:
  default_schema_id: default
  schemas:
  - id: default
    url: file:///etc/config/kratos/identity.schema.json
selfservice:
  default_browser_return_url: https://localhost:8443/dashboard
  allowed_return_urls:
  - https://localhost:8443
  - https://localhost:8443/dashboard
  - https://localhost:8443/dashboard/reports
  - https://localhost:8443/dashboard/settings
  - https://localhost:8443/login
  - https://localhost:8443/register
  - https://localhost:8443/post-registration
  - http://localhost:8443
  - http://localhost:8443/dashboard
  - http://localhost:8443/dashboard/reports
  - http://localhost:8443/dashboard/settings
  - http://localhost:8443/login
  - http://localhost:8443/register
  - http://localhost:8443/post-registration
  - https://localhost:8443/*
  - http://localhost:8443/*
  flows:
    error:
      ui_url: https://localhost:8443/error
    settings:
      ui_url: https://localhost:8443/dashboard/settings?tab=security
      lifespan: 1h
      privileged_session_max_age: 24h
      required_aal: aal1  # TEMPORARY: Allow AAL1 access to existing TOTP/passkeys
    login:
      # RESTORED: Custom STING UI that works for AAL1 authentication
      ui_url: https://localhost:8443/login
      lifespan: 1h
      after:
        default_browser_return_url: https://localhost:8443/dashboard
    registration:
      ui_url: https://localhost:8443/register
      lifespan: 1h
      after:
        password:
          hooks:
          - hook: session
        default_browser_return_url: https://localhost:8443/post-registration
    verification:
      enabled: true
      ui_url: https://localhost:8443/verification
      lifespan: 1h
      after:
        hooks:
        - hook: web_hook
          config:
            url: http://app:5050/api/kratos/webhooks/email-verified
            method: POST
            body: base64://eyAiaWRlbnRpdHkiOiAie0AgLmlkZW50aXR5IH0iIH0=
            auth:
              type: api_key
              config:
                name: X-Webhook-Token
                value: 
                in: header
        default_browser_return_url: https://localhost:8443/dashboard
    recovery:
      enabled: true
      ui_url: https://localhost:8443/recovery
      lifespan: 1h
      after:
        hooks:
        - hook: web_hook
          config:
            url: http://app:5050/api/kratos/webhooks/account-recovery
            method: POST
            body: base64://eyAiaWRlbnRpdHkiOiAie0AgLmlkZW50aXR5IH0iIH0=
            auth:
              type: api_key
              config:
                name: X-Webhook-Token
                value: 
                in: header
        default_browser_return_url: https://localhost:8443/dashboard
    logout:
      after:
        default_browser_return_url: https://localhost:8443/login
  methods:
    password:
      enabled: false
      config:
        haveibeenpwned_enabled: false
        identifier_similarity_check_enabled: false
    webauthn:
      enabled: true
      config:
        passwordless: false
        rp:
          id: localhost
          display_name: STING Platform
          origins:
          - https://localhost:8443
          - http://localhost:8443
    totp:
      enabled: true
      config:
        issuer: STING Authentication
    lookup_secret:
      enabled: true
    link:
      enabled: true
      config:
        lifespan: 1h
    code:
      enabled: true
      passwordless_enabled: true
      config:
        lifespan: 15m
secrets:
  cookie:
  - b8b7a6a76d944a64229dc9e1c858c60a
  cipher:
  - 8b530c69d41d77b45851e34a71f895c6
session:
  cookie:
    name: ory_kratos_session
    # IMPORTANT: Domain is intentionally left empty for IP address compatibility
    # When accessing via IP (e.g., 10.0.0.158), setting domain breaks cookie storage
    # Leaving it empty allows cookies to work for both IPs and hostnames
    # domain: localhost  # Commented out - causes login loops with IPs
    path: /
    same_site: Lax
  lifespan: 24h
  whoami:
    required_aal: aal1  # TEMPORARY: Allow AAL1 access to check existing credentials
courier:
  smtp:
    connection_uri: smtps://apikey:SIB_SMTP_KEY@smtp-relay.brevo.com:587
    from_address: noreply@stingassistant.com
    from_name: 🐝 STING Platform
  # NEW v25.4.0 template configuration syntax - replaces template_override_path
  templates:
    # Login code templates (passwordless login)
    login_code:
      valid:
        email:
          subject: file:///etc/config/kratos/courier-templates/login_code.subject.gotmpl
          body:
            html: file:///etc/config/kratos/courier-templates/login_code.body.gotmpl
            plaintext: file:///etc/config/kratos/courier-templates/login_code.body.plaintext.gotmpl
        sms:
          body:
            plaintext: file:///etc/config/kratos/courier-templates/login_code.body.sms.gotmpl
    
    # Registration code templates
    registration_code:
      valid:
        email:
          subject: file:///etc/config/kratos/courier-templates/registration_code.subject.gotmpl
          body:
            html: file:///etc/config/kratos/courier-templates/registration_code.body.gotmpl
        sms:
          body:
            plaintext: file:///etc/config/kratos/courier-templates/registration_code.body.sms.gotmpl
    
    # Recovery templates (account recovery)
    recovery:
      invalid:
        email:
          subject: file:///etc/config/kratos/courier-templates/recovery.invalid.email.subject.gotmpl
          body:
            html: file:///etc/config/kratos/courier-templates/recovery.invalid.email.body.gotmpl
      valid:
        email:
          subject: file:///etc/config/kratos/courier-templates/recovery.valid.email.subject.gotmpl
          body:
            html: file:///etc/config/kratos/courier-templates/recovery.valid.email.body.gotmpl
    
    # Verification templates (email verification)
    verification:
      invalid:
        email:
          subject: file:///etc/config/kratos/courier-templates/verification.invalid.email.subject.gotmpl
          body:
            html: file:///etc/config/kratos/courier-templates/verification.invalid.email.body.gotmpl
      valid:
        email:
          subject: file:///etc/config/kratos/courier-templates/verification.valid.email.subject.gotmpl
          body:
            html: file:///etc/config/kratos/courier-templates/verification.valid.email.body.gotmpl
            plaintext: file:///etc/config/kratos/courier-templates/verification.valid.email.body.plaintext.gotmpl
    
    # Verification code templates  
    verification_code:
      valid:
        email:
          subject: file:///etc/config/kratos/courier-templates/verification_code.subject.gotmpl
          body:
            html: file:///etc/config/kratos/courier-templates/verification_code.body.gotmpl